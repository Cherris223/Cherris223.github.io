<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Project | Seth Jones</title>
  <link rel="icon" type="image/png" href="assets/images/Logo.png" />
  
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/project_page.css" />

</head>

<body>

  <header>
    <div id="nav-placeholder"></div>
  </header>

  <main class="project-page">

    <section class="project-hero">

      <a
        href="index.html#projects-section"
        class="back-button"
      >
        ← Back to Projects
      </a>

      <h1 id="project-title">Loading...</h1>

      <div class="project-meta">

        <span id="project-date"></span>

        <span id="project-role"></span>

      </div>

      <div
        id="project-tags"
        class="project-tags"
      ></div>

    </section>

    <section class="project-content">

      <div class="project-image-card">

        <img
          id="project-main-image"
          src=""
          alt="Project Image"
        />

      </div>

      <div class="project-description-card">

        <h2>Overview</h2>

        <p id="project-description"></p>

      </div>

      <div class="project-details-card">

        <h2>Key Contributions</h2>

        <ul id="project-details-list"></ul>

      </div>

      <div class="project-gallery-card">

        <h2>Gallery</h2>

        <div
          id="project-gallery"
          class="project-gallery"
        ></div>

      </div>

      <section class="related-experience-card">

        <div class="related-header">

          <h2>Related Experience</h2>

          <div class="carousel-buttons">

            <button id="experience-prev">
              &#10094;
            </button>

            <button id="experience-next">
              &#10095;
            </button>

          </div>

        </div>

        <div class="experience-carousel-wrapper">

          <div
            id="related-experience-carousel"
            class="experience-carousel"
          ></div>

        </div>

      </section>

    </section>

  </main>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/project_page.js"></script>

</body>
</html>
