<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Experience | Seth Jones</title>
  <link rel="icon" type="image/png" href="assets/images/Logo.png" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/experience_page.css" />
</head>

<body>

  <header>
    <div id="nav-placeholder"></div>
  </header>

  <main class="experience-page">

    <section class="experience-hero">
      <a href="index.html#experience" class="back-button">
        ← Back to Experience
      </a>

      <h1 id="experience-title">Loading...</h1>

      <div class="experience-meta">
        <span id="experience-company"></span>
        <span id="experience-date"></span>
      </div>

      <div id="experience-tags" class="experience-tags"></div>
    </section>

    <section class="experience-content">

      <div class="experience-description-card">
        <h2>Overview</h2>
        <p id="experience-description"></p>
      </div>

      <div class="experience-details-card">
        <h2>Responsibilities</h2>
        <ul id="experience-details-list"></ul>
      </div>

    </section>

    <section class="related-projects-card">

  <div class="related-header">
    <h2>Related Projects</h2>

    <div class="carousel-buttons">
        <button id="projects-prev">&#10094;</button>
        <button id="projects-next">&#10095;</button>
        </div>
    </div>

    <div class="projects-carousel-wrapper">

        <div id="related-projects-carousel"
            class="projects-carousel">
        </div>

    </div>

    </section>

  </main>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/experience_page.js"></script>

</body>
</html>
