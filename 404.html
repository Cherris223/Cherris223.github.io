<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 | Page Not Found</title>
  <link rel="icon" type="image/png" href="assets/images/Logo.png" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/404.css" />
</head>

<body>

  <main class="error-page">

    <div class="error-glow"></div>

    <section class="error-container">

      <div class="error-code">
        <span>4</span>
        <span class="error-zero">0</span>
        <span>4</span>
      </div>

      <h1>Page Not Found</h1>

      <p class="error-description">
        The page you’re looking for doesn’t exist, was moved,
        or is currently unavailable.
      </p>

      <div class="error-actions">
        <a href="index.html" class="error-btn primary">
          Return Home
        </a>

        <a href="index.html#contactme" class="error-btn secondary">
          Contact Me
        </a>
      </div>

    </section>

    <section class="error-contact" id="contactme">

      <h2>Need Help?</h2>

      <p>
        If you believe this is a mistake or a broken link,
        feel free to reach out.
      </p>

      <div class="contact-info">
        <p>Email: sethj5878@gmail.com</p>
        <p>Location: Phoenix, AZ</p>
      </div>

    </section>

  </main>

</body>
</html>
